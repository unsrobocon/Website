# Uji Perakit + simulator di browser (Playwright) di setiap push dan pull request.
name: Uji website

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  uji:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang Playwright + Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Tambalan simulator masih cocok
        run: node tools/tambal-simulator.cjs
      - name: Uji Perakit
        run: node tests/uji-perakit.cjs
