# Menerbitkan website (beranda, perakit, simulator) ke GitHub Pages setiap ada push ke main.
# Sekali saja: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Terbitkan website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  terbit:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan berkas situs
        run: |
          mkdir -p _site
          cp -r index.html .nojekyll perakit simulator _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
